name: Corregir JavaScript de navegación

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-js-navigation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir expresión regular y validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old=r'/^https?:\\/\\/\\S+$/i'
          new=r'/^https?:\/\/\S+$/i'
          count=text.count(old)
          if count != 1:
              raise SystemExit(f'Se esperaba exactamente 1 expresión defectuosa y se encontraron {count}')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          for i,s in enumerate(scripts): Path(f'/tmp/inline-{i}.js').write_text(s,encoding='utf-8')
          print(len(scripts))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          node --check sync.js
      - name: Publicar corrección
        shell: bash
        run: |
          git config user.name "chatgpt-platform-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-js-navigation.yml
          git rm -f syntax-report.txt
          git add index.html
          git commit -m "Corregir JavaScript que bloqueaba la navegación"
          git push origin HEAD:main
