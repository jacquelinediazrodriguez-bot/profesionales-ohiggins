name: Corregir JavaScript de navegación

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-js-navigation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir expresiones regulares y validar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          lines=p.read_text(encoding='utf-8').splitlines()
          found_url=found_year=False
          for i,line in enumerate(lines):
              if "La URL debe comenzar con http:// o https://" in line:
                  lines[i]=" if(r.url&&!/^https?:\\/\\/\\S+$/i.test(r.url))return 'La URL debe comenzar con http:// o https://';"
                  found_url=True
              if "El año debe tener cuatro dígitos" in line:
                  lines[i]=" if(!/^(\\d{4}|s\\. ?f\\.)$/.test(r.ano||''))return 'El año debe tener cuatro dígitos (por ejemplo, 2026) o indicar s. f.';"
                  found_year=True
          if not (found_url and found_year):
              raise SystemExit(f'No se localizaron las líneas esperadas: url={found_url}, year={found_year}')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          for i,s in enumerate(scripts): Path(f'/tmp/inline-{i}.js').write_text(s,encoding='utf-8')
          PY
          : > syntax-report-after-fix.txt
          for f in /tmp/inline-*.js; do
            echo "=== $f ===" >> syntax-report-after-fix.txt
            node --check "$f" >> syntax-report-after-fix.txt 2>&1 || true
          done
          echo "=== sync.js ===" >> syntax-report-after-fix.txt
          node --check sync.js >> syntax-report-after-fix.txt 2>&1 || true
      - name: Publicar corrección y diagnóstico
        shell: bash
        run: |
          git config user.name "chatgpt-platform-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-js-navigation.yml
          git rm -f syntax-report.txt
          git add index.html syntax-report-after-fix.txt
          git commit -m "Corregir JavaScript que bloqueaba la navegación"
          git push origin HEAD:main
