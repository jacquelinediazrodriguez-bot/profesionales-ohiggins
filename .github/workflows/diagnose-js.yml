name: Diagnosticar JavaScript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-js.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extraer y validar scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          out=[]
          for i,s in enumerate(scripts):
              p=Path(f'/tmp/inline-{i}.js'); p.write_text(s,encoding='utf-8')
              out.append(str(p))
          Path('/tmp/script-list.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          : > syntax-report.txt
          while IFS= read -r f; do
            echo "=== $f ===" >> syntax-report.txt
            node --check "$f" >> syntax-report.txt 2>&1 || true
          done < /tmp/script-list.txt
          echo "=== sync.js ===" >> syntax-report.txt
          node --check sync.js >> syntax-report.txt 2>&1 || true
      - name: Guardar diagnóstico
        shell: bash
        run: |
          git config user.name "chatgpt-platform-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/diagnose-js.yml
          git add syntax-report.txt
          git commit -m "Registrar diagnóstico JavaScript"
          git push origin HEAD:main
