name: Corregir mensajes de contacto

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-admin-contact-async.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir y validar JavaScript completo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          old='function adminContactos(){'
          new='async function adminContactos(){'
          if text.count(old) != 1:
              raise SystemExit(f'Se esperaba 1 función adminContactos y se encontraron {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          for i,s in enumerate(scripts): Path(f'/tmp/inline-{i}.js').write_text(s,encoding='utf-8')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          node --check sync.js
      - name: Publicar corrección
        shell: bash
        run: |
          git config user.name "chatgpt-platform-maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-admin-contact-async.yml
          git rm -f syntax-report-after-fix.txt
          git add index.html
          git commit -m "Corregir carga de JavaScript y navegación"
          git push origin HEAD:main
